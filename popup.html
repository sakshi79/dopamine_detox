<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dopamine Detox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup">
  <header class="bar">
    <h1>Dopamine Detox</h1>
    <button id="open-settings" class="icon-btn" aria-label="Open settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/>
        <circle cx="16" cy="6" r="2"/>
        <circle cx="10" cy="12" r="2"/>
        <circle cx="18" cy="18" r="2"/>
      </svg>
    </button>
  </header>

  <section class="hero" id="hero" data-state="unknown">
    <div class="glass" id="glass" role="img" aria-label="Loading">
      <div class="water"></div>
      <div class="threshold"></div>
    </div>
    <div class="reading" aria-live="polite">
      <p class="status" id="status">Reading…</p>
      <p class="score" id="score"></p>
      <p class="hint" id="hint"></p>
    </div>
  </section>

  <section class="detox" id="detox" aria-live="polite"></section>

  <section id="drivers-section" hidden>
    <h2>What’s pulling it down</h2>
    <ul class="drivers" id="drivers"></ul>
  </section>

  <section>
    <h2>Today</h2>
    <dl class="stats" id="stats"></dl>
    <ol class="sites" id="sites"></ol>
  </section>

  <section>
    <h2>Last 7 days</h2>
    <div class="week" id="week"></div>
  </section>

  <p class="fine">Estimated from how you browse, not measured from your brain. Treat it as a mirror, not a diagnosis.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>
